[supervisord]
nodaemon = true
user = %(ENV_USER)s
logfile = /dev/stdout
logfile_maxbytes = 0
; supervisord runs as the unprivileged app user, and /var/run -> /run is
; REDACTED-owned, so the runtime socket/pid must live in a writable directory.
pidfile = /tmp/supervisord.pid

[unix_http_server]
file = /tmp/supervisor.sock
chmod = 0700

[supervisorctl]
serverurl = unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
